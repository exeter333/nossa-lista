<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <title>Lista compartilhada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    :root {
      --bg: #eef2ee;
      --surface: #ffffff;
      --ink: #1c2a25;
      --muted: #66746e;
      --line: #d5ddd7;
      --accent: #2f5d50;
      --accent-ink: #ffffff;
      --danger: #a4372b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141b18;
        --surface: #1d2622;
        --ink: #e6efe9;
        --muted: #8d9c95;
        --line: #2f3b36;
        --accent: #7fc2ab;
        --accent-ink: #10201a;
        --danger: #e07a6c;
      }
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Figtree", system-ui, sans-serif;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 18px 80px;
    }

    h1 {
      font: 700 2rem/1.1 "Bricolage Grotesque", system-ui, sans-serif;
      margin: 0 0 4px;
    }

    .sub {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 20px;
      display: flex;
      gap: 6px 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
      flex: none;
    }

    .dot.on {
      background: var(--accent);
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .linha {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .grupo {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .rotulo {
      font-size: .85rem;
      color: var(--muted);
      min-width: 6.2rem;
    }

    .chip {
      border: 1.5px solid var(--c, var(--line));
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 13px;
      font-size: .92rem;
      font-weight: 500;
    }

    .chip[aria-pressed="true"] {
      background: var(--c, var(--accent));
      color: var(--on, var(--accent-ink));
      font-weight: 600;
    }

    form.novo {
      display: flex;
      gap: 8px;
      margin: 4px 0 20px;
    }

    input[type=text] {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .add {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      font-weight: 600;
    }

    ul.itens {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    ul.itens li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 10px 4px;
      border-bottom: 1px solid var(--line);
      border-left: 6px solid var(--c);
      background: var(--surface);
      background: color-mix(in srgb, var(--c) 17%, var(--surface));
    }

    ul.itens li:last-child {
      border-bottom: 0;
    }

    .grip {
      flex: none;
      width: 32px;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    li input[type=checkbox] {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
      flex: none;
      cursor: pointer;
    }

    .corpo {
      flex: 1;
      min-width: 0;
    }

    .texto {
      display: block;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: .8rem;
      color: var(--muted);
    }

    .dono {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dono i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c);
      display: inline-block;
    }

    .pill {
      border: 1px solid var(--muted);
      border-radius: 999px;
      padding: 0 8px;
      color: var(--ink);
    }

    li.done .texto {
      text-decoration: line-through;
      color: var(--muted);
    }

    .del {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .del:hover {
      color: var(--danger);
    }

    .sortable-ghost {
      opacity: .55;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px;
    }

    .tools {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .link {
      background: none;
      border: 0;
      color: var(--accent);
      font-weight: 600;
      padding: 6px 0;
      font-size: inherit;
    }

    .link.warn {
      color: var(--danger);
    }

    a.link {
      text-decoration: none;
    }

    .msg {
      background: var(--surface);
      border: 1.5px solid var(--danger);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
      color: var(--danger);
      display: none;
    }

    details {
      margin-top: 22px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 4px 14px;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      padding: 10px 0;
    }

    .sec {
      font-size: .85rem;
      color: var(--muted);
      margin: 8px 0 2px;
    }

    .tag-linha {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
    }

    .tag-linha .nome {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    input[type=color] {
      width: 40px;
      height: 34px;
      padding: 2px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
    }

    form.nova-tag {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 12px 0 10px;
      border-top: 1px solid var(--line);
    }

    form.nova-tag input[type=text] {
      padding: 9px 12px;
    }

    .gate {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gate form {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gate h1 {
      margin-bottom: 0;
    }

    .gate p {
      margin: 0;
      color: var(--muted);
    }

    .gate input[type=password] {
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      width: 100%;
    }

    .gate .add {
      padding: 12px 18px;
    }

    .gate .erro-senha {
      color: var(--danger);
      font-size: .9rem;
    }
  </style>
</head>

<body>
  <div class="gate" id="gate">
    <form id="gateForm" autocomplete="off">
      <h1>Lista compartilhada</h1>
      <p>Digite a senha para entrar.</p>
      <input type="password" id="senha" placeholder="Senha" aria-label="Senha" autocomplete="current-password" required>
      <button class="add" type="submit">Entrar</button>
      <p class="erro-senha" id="erroSenha" role="alert" hidden></p>
    </form>
  </div>
  <main id="app" hidden>
    <h1>Lista compartilhada</h1>
    <p class="sub">
      <span><span class="dot" id="dot"></span> <span id="status">Conectando…</span></span>
      <button class="link" id="copiar" type="button">Copiar link da lista</button>
      <a class="link" id="irVisto" href="visto.html">Ver itens vistos</a>
    </p>

    <div class="msg" id="erro"></div>

    <div class="linha" role="group" aria-label="Quem adiciona o item">
      <span class="rotulo">Novo item de:</span>
      <span class="grupo" id="selDono"></span>
    </div>
    <div class="linha" id="linhaExtra" role="group" aria-label="Etiqueta opcional" hidden>
      <span class="rotulo">Etiqueta (opcional):</span>
      <span class="grupo" id="selExtra"></span>
    </div>
    <form class="novo" id="form" autocomplete="off">
      <input type="text" id="novo" placeholder="Adicionar item" maxlength="200" aria-label="Novo item" required>
      <button class="add" type="submit">Adicionar</button>
    </form>

    <div class="linha" role="group" aria-label="Filtrar por pessoa">
      <span class="rotulo">Mostrar de:</span>
      <span class="grupo" id="filDono"></span>
    </div>
    <div class="linha" id="linhaFilExtra" role="group" aria-label="Filtrar por etiqueta" hidden>
      <span class="rotulo">Com etiqueta:</span>
      <span class="grupo" id="filExtra"></span>
    </div>

    <ul class="itens" id="lista"></ul>
    <p class="empty" id="vazio" hidden></p>

    <div class="tools">
      <button class="link" id="limpar" type="button">Mover marcados para visto</button>
    </div>

    <details id="painel">
      <summary>Cores e etiquetas</summary>
      <p class="sec">Cor de cada pessoa (vale para todos os itens)</p>
      <div id="cores"></div>
      <p class="sec">Etiquetas extras</p>
      <div id="extras"></div>
      <form class="nova-tag" id="formTag" autocomplete="off">
        <input type="text" id="nomeNova" placeholder="Nova etiqueta" maxlength="24" aria-label="Nome da nova etiqueta"
          required>
        <button class="add" type="submit" style="padding:9px 16px">Criar</button>
      </form>
    </details>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      initializeFirestore, collection, addDoc, setDoc, updateDoc, deleteDoc, doc,
      onSnapshot, query, serverTimestamp, writeBatch, getDocs, where
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCf41LltqqwYfoqztr1crdjDEdFIYFcWw4",
      authDomain: "lista-compartilhada-968f3.firebaseapp.com",
      projectId: "lista-compartilhada-968f3",
      storageBucket: "lista-compartilhada-968f3.firebasestorage.app",
      messagingSenderId: "1018696660438",
      appId: "1:1018696660438:web:417135cb69c1b81cd56077"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const $ = (id) => document.getElementById(id);
    const mostrarErro = (t) => { $("erro").textContent = t; $("erro").style.display = "block"; };

    // Lista única: o mesmo código em todos os aparelhos, sempre a mesma lista.
    // Para manter itens que você já criou, troque pelo código antigo (o valor depois de ?lista= na URL).
    const listaId = "rebecca-jose-k7x29qpl";

    $("copiar").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(location.href); $("copiar").textContent = "Link copiado"; }
      catch { prompt("Copie o link da lista:", location.href); }
      setTimeout(() => ($("copiar").textContent = "Copiar link da lista"), 2000);
    });

    // ---- Tela de senha ----
    // Guardamos só o hash da senha (SHA-256), não a senha em si.
    const SENHA_HASH = "44c4289ed94917db9ea4815c20b1211edb41fb2a28f0e0a466503df762ba2609";
    async function hashDe(t) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("lista-v1:" + t));
      return [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, "0")).join("");
    }
    function abrirApp() {
      $("gate").hidden = true;
      $("app").hidden = false;
      if (firebaseConfig.apiKey === "COLE_AQUI") {
        mostrarErro("Configure o Firebase: cole o seu firebaseConfig no início do script deste arquivo.");
        $("status").textContent = "Sem configuração";
      } else {
        iniciar();
      }
    }
    let jaEntrou = false;
    try { jaEntrou = sessionStorage.getItem("lista:ok") === SENHA_HASH; } catch { }
    if (jaEntrou) {
      abrirApp();
    } else {
      $("senha").focus();
      $("gateForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const erro = $("erroSenha");
        if (!(window.crypto && crypto.subtle)) {
          erro.textContent = "Este navegador não permite verificar a senha. Abra o site pelo endereço https.";
          erro.hidden = false;
          return;
        }
        if ((await hashDe($("senha").value)) === SENHA_HASH) {
          try { sessionStorage.setItem("lista:ok", SENHA_HASH); } catch { }
          abrirApp();
        } else {
          erro.textContent = "Senha incorreta.";
          erro.hidden = false;
          $("senha").select();
        }
      });
    }

    function iniciar() {
      const db = initializeFirestore(initializeApp(firebaseConfig), { experimentalAutoDetectLongPolling: true });
      const itensCol = collection(db, "listas", listaId, "itens");
      const tagsCol = collection(db, "listas", listaId, "tags");

      let tags = [], itens = [], visiveis = [];
      let filtroDono = "todos", filtroExtra = "todas";
      let donoNovo = lembrado(), extraNovo = "";
      let semeado = false, arrastando = false, pendente = false;

      function lembrado() { try { return localStorage.getItem("lista:dono") || ""; } catch { return ""; } }
      function lembrar(id) { try { localStorage.setItem("lista:dono", id); } catch { } }

      const donos = () => tags.filter((t) => t.padrao);   // Rebecca e José
      const extras = () => tags.filter((t) => !t.padrao); // etiquetas opcionais

      function textoSobre(hex) {
        const n = parseInt(hex.slice(1), 16);
        const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
        return lum > 0.62 ? "#1c2a25" : "#ffffff";
      }
      const marcar = (el, hex) => { el.style.setProperty("--c", hex); el.style.setProperty("--on", textoSobre(hex)); };

      const posicao = (d) => {
        if (typeof d.ordem === "number") return d.ordem;
        if (d.criadoEm && d.criadoEm.toMillis) return d.criadoEm.toMillis();
        return Date.now();
      };

      // Dono do item (Rebecca ou José). Itens antigos com "autor" casam pelo nome.
      const donoDe = (item) =>
        donos().find((t) => t.id === item.tag) ||
        (item.autor && donos().find((t) => t.nome.toLowerCase() === item.autor.toLowerCase())) || null;

      // Etiqueta extra do item. Itens da versão anterior guardavam a etiqueta customizada em "tag".
      const extraIdDe = (item) => {
        if (item.extra) return item.extra;
        if (item.tag && !donos().some((t) => t.id === item.tag)) return item.tag;
        return null;
      };
      const extraDe = (item) => extras().find((t) => t.id === extraIdDe(item)) || null;

      // ---- Etiquetas ----
      onSnapshot(query(tagsCol), { includeMetadataChanges: true }, (snap) => {
        if (!snap.metadata.fromCache && snap.empty && !semeado) {
          semeado = true;
          setDoc(doc(tagsCol, "rebecca"), { nome: "Rebecca", cor: "#ec6fa3", padrao: true, ordem: 1 });
          setDoc(doc(tagsCol, "jose"), { nome: "José", cor: "#4a8fe0", padrao: true, ordem: 2 });
        }
        tags = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
        if (filtroDono !== "todos" && !donos().some((t) => t.id === filtroDono)) filtroDono = "todos";
        if (filtroExtra !== "todas" && !extras().some((t) => t.id === filtroExtra)) filtroExtra = "todas";
        if (extraNovo && !extras().some((t) => t.id === extraNovo)) extraNovo = "";
        if (!donos().some((t) => t.id === donoNovo) && donos().length) donoNovo = donos()[0].id;
        desenharTags();
        desenharItens();
      }, (e) => {
        mostrarErro("Não foi possível ler as etiquetas (" + e.code + "). Atualize as regras do Firestore para liberar a coleção 'tags'.");
      });

      // ---- Itens ----
      onSnapshot(query(itensCol), { includeMetadataChanges: true }, (snap) => {
        $("dot").classList.toggle("on", !snap.metadata.fromCache);
        $("status").textContent = snap.metadata.fromCache ? "Offline, será sincronizado" : "Sincronizado";
        itens = snap.docs
          .map((d) => { const v = d.data({ serverTimestamps: "estimate" }); return { id: d.id, ...v, _pos: posicao(v) }; })
          .sort((a, b) => a._pos - b._pos);
        if (arrastando) { pendente = true; return; }
        desenharItens();
      }, (e) => {
        $("status").textContent = "Erro de conexão";
        mostrarErro("Não foi possível ler a lista (" + e.code + "). Verifique as regras do Firestore e o firebaseConfig.");
      });

      function chip(texto, hex, ativo, onclick) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = texto;
        b.setAttribute("aria-pressed", ativo ? "true" : "false");
        if (hex) marcar(b, hex);
        b.onclick = onclick;
        return b;
      }

      function desenharTags() {
        const D = donos(), E = extras();

        const sd = $("selDono"); sd.innerHTML = "";
        for (const t of D) sd.append(chip(t.nome, t.cor, t.id === donoNovo, () => { donoNovo = t.id; lembrar(t.id); desenharTags(); }));

        $("linhaExtra").hidden = E.length === 0;
        const se = $("selExtra"); se.innerHTML = "";
        se.append(chip("Nenhuma", null, extraNovo === "", () => { extraNovo = ""; desenharTags(); }));
        for (const t of E) se.append(chip(t.nome, null, t.id === extraNovo, () => { extraNovo = t.id; desenharTags(); }));

        const fd = $("filDono"); fd.innerHTML = "";
        fd.append(chip("Todos", null, filtroDono === "todos", () => { filtroDono = "todos"; desenharTags(); desenharItens(); }));
        for (const t of D) fd.append(chip(t.nome, t.cor, filtroDono === t.id, () => { filtroDono = t.id; desenharTags(); desenharItens(); }));

        $("linhaFilExtra").hidden = E.length === 0;
        const fe = $("filExtra"); fe.innerHTML = "";
        fe.append(chip("Todas", null, filtroExtra === "todas", () => { filtroExtra = "todas"; desenharTags(); desenharItens(); }));
        for (const t of E) fe.append(chip(t.nome, null, filtroExtra === t.id, () => { filtroExtra = t.id; desenharTags(); desenharItens(); }));

        // Painel (não reconstrói enquanto o usuário edita algo nele)
        if ($("painel").contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
        const cores = $("cores"); cores.innerHTML = "";
        for (const t of D) {
          const row = document.createElement("div"); row.className = "tag-linha";
          const cor = document.createElement("input");
          cor.type = "color"; cor.value = t.cor || "#999999";
          cor.setAttribute("aria-label", "Cor de " + t.nome);
          cor.addEventListener("change", () => updateDoc(doc(tagsCol, t.id), { cor: cor.value }));
          const nome = document.createElement("span"); nome.className = "nome"; nome.textContent = t.nome;
          row.append(cor, nome); cores.append(row);
        }
        const ex = $("extras"); ex.innerHTML = "";
        if (!E.length) { const p = document.createElement("p"); p.className = "sec"; p.textContent = "Nenhuma ainda."; ex.append(p); }
        for (const t of E) {
          const row = document.createElement("div"); row.className = "tag-linha";
          const nome = document.createElement("span"); nome.className = "nome"; nome.textContent = t.nome;
          const del = document.createElement("button");
          del.type = "button"; del.className = "link warn"; del.textContent = "Excluir";
          del.onclick = () => {
            if (confirm("Excluir a etiqueta \"" + t.nome + "\"? Os itens continuam na lista, sem essa etiqueta.")) deleteDoc(doc(tagsCol, t.id));
          };
          row.append(nome, del); ex.append(row);
        }
      }

      function desenharItens() {
        visiveis = itens.filter((i) =>
          (filtroDono === "todos" || (donoDe(i) && donoDe(i).id === filtroDono)) &&
          (filtroExtra === "todas" || extraIdDe(i) === filtroExtra));
        const ul = $("lista"); ul.innerHTML = "";
        const vazio = $("vazio");
        vazio.hidden = visiveis.length > 0;
        vazio.textContent = itens.length ? "Nenhum item com esse filtro." : "A lista está vazia. Adicione o primeiro item.";
        ul.hidden = visiveis.length === 0;

        for (const item of visiveis) {
          const dono = donoDe(item), extra = extraDe(item);
          const li = document.createElement("li");
          li.dataset.id = item.id;
          li.style.setProperty("--c", dono ? dono.cor : "#9aa7a1");
          if (item.feito) li.className = "done";

          const grip = document.createElement("span");
          grip.className = "grip"; grip.textContent = "⋮⋮"; grip.title = "Arraste para reordenar";
          grip.setAttribute("aria-hidden", "true");

          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = !!item.feito;
          cb.setAttribute("aria-label", "Marcar " + item.texto);
          cb.onchange = () => updateDoc(doc(itensCol, item.id), { feito: cb.checked });

          const corpo = document.createElement("div"); corpo.className = "corpo";
          const txt = document.createElement("span"); txt.className = "texto"; txt.textContent = item.texto;
          corpo.append(txt);
          const nomeDono = dono ? dono.nome : item.autor;
          if (nomeDono || extra) {
            const meta = document.createElement("span"); meta.className = "meta";
            if (nomeDono) {
              const d = document.createElement("span"); d.className = "dono";
              d.append(document.createElement("i"), document.createTextNode(nomeDono));
              meta.append(d);
            }
            if (extra) {
              const p = document.createElement("span"); p.className = "pill"; p.textContent = extra.nome;
              meta.append(p);
            }
            corpo.append(meta);
          }

          const del = document.createElement("button");
          del.className = "del"; del.type = "button"; del.textContent = "×";
          del.setAttribute("aria-label", "Remover " + item.texto);
          del.onclick = () => deleteDoc(doc(itensCol, item.id));

          li.append(grip, cb, corpo, del);
          ul.append(li);
        }
      }

      // ---- Reordenar arrastando ----
      Sortable.create($("lista"), {
        handle: ".grip", animation: 150, ghostClass: "sortable-ghost",
        onStart: () => { arrastando = true; },
        onEnd: async (ev) => {
          arrastando = false;
          const fim = () => { if (pendente) { pendente = false; desenharItens(); } };
          if (ev.oldIndex === ev.newIndex) return fim();
          const ids = [...$("lista").children].map((li) => li.dataset.id);
          const i = ids.indexOf(ev.item.dataset.id);
          const mapa = new Map(visiveis.map((x) => [x.id, x._pos]));
          const antes = i > 0 ? mapa.get(ids[i - 1]) : null;
          const depois = i < ids.length - 1 ? mapa.get(ids[i + 1]) : null;
          let nova;
          if (antes === null && depois === null) return fim();
          else if (antes === null) nova = depois - 1000;
          else if (depois === null) nova = antes + 1000;
          else nova = (antes + depois) / 2;
          try { await updateDoc(doc(itensCol, ev.item.dataset.id), { ordem: nova }); }
          catch (err) { mostrarErro("Não foi possível reordenar (" + err.code + ")."); }
          fim();
        }
      });

      // ---- Adicionar item ----
      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const texto = $("novo").value.trim();
        if (!texto) return;
        if (!donos().length) return mostrarErro("As etiquetas ainda não carregaram. Tente de novo em instantes.");
        $("novo").value = "";
        try {
          await addDoc(itensCol, {
            texto, tag: donoNovo, extra: extraNovo || null,
            feito: false, ordem: Date.now(), criadoEm: serverTimestamp()
          });
        } catch (err) { mostrarErro("Não foi possível adicionar o item (" + err.code + ")."); }
        extraNovo = "";            // a etiqueta extra vale só para o item que acabou de ser criado
        desenharTags();
        $("novo").focus();
      });

      // ---- Criar etiqueta extra ----
      $("formTag").addEventListener("submit", async (e) => {
        e.preventDefault();
        const nome = $("nomeNova").value.trim();
        if (!nome) return;
        try {
          await addDoc(tagsCol, { nome, padrao: false, ordem: Date.now() });
          $("nomeNova").value = "";
        } catch (err) { mostrarErro("Não foi possível criar a etiqueta (" + err.code + ")."); }
      });

      // ---- Mover marcados para a lista de vistos ----
      const vistosCol = collection(db, "listas", listaId, "vistos");

      $("limpar").addEventListener("click", async () => {
        try {
          const marcados = await getDocs(query(itensCol, where("feito", "==", true)));
          if (marcados.empty) return alert("Nenhum item marcado.");
          if (!confirm("Mover " + marcados.size + " item(ns) marcado(s) para a lista de vistos?")) return;
          const docs = marcados.docs;
          for (let i = 0; i < docs.length; i += 200) {   // limite de 500 operações por lote
            const batch = writeBatch(db);
            for (const d of docs.slice(i, i + 200)) {
              batch.set(doc(vistosCol, d.id), { ...d.data(), vistoEm: serverTimestamp() });
              batch.delete(d.ref);
            }
            await batch.commit();
          }
        } catch (err) { mostrarErro("Não foi possível mover os itens (" + err.code + ")."); }
      });
    }
  </script>
</body>

</html>
