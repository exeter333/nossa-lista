<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <title>Lista compartilhada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    :root {
      --bg: #eef2ee;
      --surface: #ffffff;
      --ink: #1c2a25;
      --muted: #66746e;
      --line: #d5ddd7;
      --accent: #2f5d50;
      --accent-ink: #ffffff;
      --danger: #a4372b;
      --drag: #e3ece6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141b18;
        --surface: #1d2622;
        --ink: #e6efe9;
        --muted: #8d9c95;
        --line: #2f3b36;
        --accent: #7fc2ab;
        --accent-ink: #10201a;
        --danger: #e07a6c;
        --drag: #29362f;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Figtree", system-ui, sans-serif;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 18px 80px;
    }

    h1 {
      font: 700 2rem/1.1 "Bricolage Grotesque", system-ui, sans-serif;
      margin: 0 0 4px;
    }

    .sub {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 22px;
      display: flex;
      gap: 6px 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
    }

    .dot.on {
      background: var(--accent);
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    input[type=text] {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .add {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      font-weight: 600;
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 10px 4px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    li:last-child {
      border-bottom: 0;
    }

    .grip {
      flex: none;
      width: 34px;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    li input[type=checkbox] {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
      flex: none;
      cursor: pointer;
    }

    .corpo {
      flex: 1;
      min-width: 0;
    }

    .texto {
      display: block;
      overflow-wrap: anywhere;
    }

    .autor {
      display: block;
      font-size: .8rem;
      color: var(--muted);
    }

    li.done .texto {
      text-decoration: line-through;
      color: var(--muted);
    }

    .del {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .del:hover {
      color: var(--danger);
    }

    .sortable-ghost {
      background: var(--drag);
      opacity: .7;
    }

    .sortable-chosen {
      cursor: grabbing;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px;
    }

    .tools {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .link {
      background: none;
      border: 0;
      color: var(--accent);
      font-weight: 600;
      padding: 6px 0;
      font-size: inherit;
    }

    .link.warn {
      color: var(--danger);
    }

    .msg {
      background: var(--surface);
      border: 1.5px solid var(--danger);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
      color: var(--danger);
      display: none;
    }
  </style>
</head>

<body>
  <main>
    <h1>Lista compartilhada</h1>
    <p class="sub">
      <span><span class="dot" id="dot"></span> <span id="status">Conectando…</span></span>
      <button class="link" id="copiar" type="button">Copiar link da lista</button>
      <button class="link" id="nome" type="button"></button>
    </p>

    <div class="msg" id="erro"></div>

    <form id="form" autocomplete="off">
      <input type="text" id="novo" placeholder="Adicionar item" maxlength="200" aria-label="Novo item" required>
      <button class="add" type="submit">Adicionar</button>
    </form>

    <ul id="lista"></ul>
    <p class="empty" id="vazio" hidden>A lista está vazia. Adicione o primeiro item.</p>

    <div class="tools">
      <button class="link warn" id="limpar" type="button">Remover itens concluídos</button>
    </div>
  </main>

  <script type="module">
    import {
      getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
      onSnapshot, query, orderBy, serverTimestamp, writeBatch, getDocs, where
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCf41LltqqwYfoqztr1crdjDEdFIYFcWw4",
      authDomain: "lista-compartilhada-968f3.firebaseapp.com",
      projectId: "lista-compartilhada-968f3",
      storageBucket: "lista-compartilhada-968f3.firebasestorage.app",
      messagingSenderId: "1018696660438",
      appId: "1:1018696660438:web:417135cb69c1b81cd56077"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    // =======================================================

    const $ = (id) => document.getElementById(id);
    const erro = $("erro");
    const mostrarErro = (t) => { erro.textContent = t; erro.style.display = "block"; };

    // ---- Nome de quem usa este aparelho (guardado só neste navegador) ----
    let meuNome = "";
    try { meuNome = localStorage.getItem("lista:nome") || ""; } catch { }
    function pedirNome() {
      const n = (prompt("Seu nome (aparece nos itens que você adicionar):", meuNome) || "").trim().slice(0, 30);
      if (n) {
        meuNome = n;
        try { localStorage.setItem("lista:nome", n); } catch { }
      }
      atualizarBotaoNome();
    }
    function atualizarBotaoNome() {
      $("nome").textContent = meuNome ? "Você: " + meuNome + " (trocar)" : "Definir meu nome";
    }
    atualizarBotaoNome();
    $("nome").addEventListener("click", pedirNome);
    if (!meuNome) setTimeout(pedirNome, 300);

    // ---- Código da lista na URL ----
    const params = new URLSearchParams(location.search);
    let listaId = params.get("lista");
    if (!listaId) {
      listaId = "lista-" + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8);
      params.set("lista", listaId);
      history.replaceState(null, "", "?" + params.toString());
    }

    if (firebaseConfig.apiKey === "COLE_AQUI") {
      mostrarErro("Configure o Firebase: cole o seu firebaseConfig no início do script deste arquivo.");
      $("status").textContent = "Sem configuração";
    } else {
      iniciar();
    }

    function iniciar() {
      const db = initializeFirestore(initializeApp(firebaseConfig), {
        experimentalAutoDetectLongPolling: true
      });
      const itens = collection(db, "listas", listaId, "itens");

      let atual = [];        // itens na ordem exibida
      let arrastando = false;
      let pendente = null;   // atualização recebida durante o arraste

      // Posição de cada item: campo "ordem"; itens antigos usam a data de criação.
      const posicao = (d) => {
        if (typeof d.ordem === "number") return d.ordem;
        if (d.criadoEm && d.criadoEm.toMillis) return d.criadoEm.toMillis();
        return Date.now();
      };

      onSnapshot(
        query(itens),
        { includeMetadataChanges: true },
        (snap) => {
          $("dot").classList.toggle("on", !snap.metadata.fromCache);
          $("status").textContent = snap.metadata.fromCache ? "Offline, será sincronizado" : "Sincronizado";
          const lista = snap.docs
            .map((d) => { const v = d.data({ serverTimestamps: "estimate" }); return { id: d.id, ...v, _pos: posicao(v) }; })
            .sort((a, b) => a._pos - b._pos);
          if (arrastando) { pendente = lista; return; }
          desenhar(lista);
        },
        (e) => {
          $("status").textContent = "Erro de conexão";
          mostrarErro("Não foi possível ler a lista (" + e.code + "). Verifique as regras do Firestore e o firebaseConfig.");
        }
      );

      function desenhar(lista) {
        atual = lista;
        const ul = $("lista");
        ul.innerHTML = "";
        $("vazio").hidden = lista.length > 0;
        ul.hidden = lista.length === 0;
        for (const item of lista) {
          const li = document.createElement("li");
          li.dataset.id = item.id;
          if (item.feito) li.className = "done";

          const grip = document.createElement("span");
          grip.className = "grip";
          grip.textContent = "⋮⋮";
          grip.setAttribute("aria-hidden", "true");
          grip.title = "Arraste para reordenar";

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!item.feito;
          cb.setAttribute("aria-label", "Marcar " + item.texto);
          cb.onchange = () => updateDoc(doc(itens, item.id), { feito: cb.checked });

          const corpo = document.createElement("div");
          corpo.className = "corpo";
          const txt = document.createElement("span");
          txt.className = "texto";
          txt.textContent = item.texto;
          corpo.append(txt);
          if (item.autor) {
            const a = document.createElement("span");
            a.className = "autor";
            a.textContent = "Adicionado por " + item.autor;
            corpo.append(a);
          }

          const del = document.createElement("button");
          del.className = "del";
          del.type = "button";
          del.textContent = "×";
          del.setAttribute("aria-label", "Remover " + item.texto);
          del.onclick = () => deleteDoc(doc(itens, item.id));

          li.append(grip, cb, corpo, del);
          ul.append(li);
        }
      }

      // ---- Reordenar arrastando (funciona com mouse e toque) ----
      Sortable.create($("lista"), {
        handle: ".grip",
        animation: 150,
        ghostClass: "sortable-ghost",
        onStart: () => { arrastando = true; },
        onEnd: async (ev) => {
          arrastando = false;
          const fim = () => { if (pendente) { desenhar(pendente); pendente = null; } };
          if (ev.oldIndex === ev.newIndex) return fim();

          // Só o item movido recebe uma nova posição, entre os dois vizinhos.
          const ids = [...$("lista").children].map((li) => li.dataset.id);
          const i = ids.indexOf(ev.item.dataset.id);
          const mapa = new Map(atual.map((x) => [x.id, x._pos]));
          const antes = i > 0 ? mapa.get(ids[i - 1]) : null;
          const depois = i < ids.length - 1 ? mapa.get(ids[i + 1]) : null;
          let nova;
          if (antes === null && depois === null) return fim();
          else if (antes === null) nova = depois - 1000;
          else if (depois === null) nova = antes + 1000;
          else nova = (antes + depois) / 2;

          try {
            await updateDoc(doc(itens, ev.item.dataset.id), { ordem: nova });
          } catch (err) {
            mostrarErro("Não foi possível reordenar (" + err.code + ").");
          }
          fim();
        }
      });

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const texto = $("novo").value.trim();
        if (!texto) return;
        if (!meuNome) pedirNome();
        $("novo").value = "";
        try {
          await addDoc(itens, {
            texto,
            autor: meuNome || "",
            feito: false,
            ordem: Date.now(),      // novos itens entram no fim da lista
            criadoEm: serverTimestamp()
          });
        } catch (err) {
          mostrarErro("Não foi possível adicionar o item (" + err.code + ").");
        }
        $("novo").focus();
      });

      $("limpar").addEventListener("click", async () => {
        const feitos = await getDocs(query(itens, where("feito", "==", true)));
        if (feitos.empty) return;
        if (!confirm("Remover " + feitos.size + " item(ns) concluído(s)?")) return;
        const batch = writeBatch(db);
        feitos.forEach((d) => batch.delete(d.ref));
        await batch.commit();
      });
    }

    $("copiar").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        $("copiar").textContent = "Link copiado";
      } catch {
        prompt("Copie o link da lista:", location.href);
      }
      setTimeout(() => ($("copiar").textContent = "Copiar link da lista"), 2000);
    });
  </script>
</body>

</html>
